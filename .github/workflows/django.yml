name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: innovare_test
          POSTGRES_USER: innovare
          POSTGRES_PASSWORD: innovare_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U innovare -d innovare_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_NAME: innovare_test
      DB_USER: innovare
      DB_PASSWORD: innovare_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: ./backend
        run: |
          python manage.py migrate --noinput
          python manage.py test
